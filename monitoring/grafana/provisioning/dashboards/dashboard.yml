apiVersion: 1

providers:
  - name: 'PixelBattle Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Mounted via Swarm configs at /etc/grafana/dashboards (not under grafana_data).
      path: /etc/grafana/dashboards
