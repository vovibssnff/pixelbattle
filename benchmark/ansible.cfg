[defaults]
inventory          = inventory.yml
roles_path         = roles
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = ansible.builtin.default
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = /tmp/ansible_facts_pixelbattle
fact_caching_timeout = 3600
# auto_silent: auto-detects Python per host without printing warnings.
# For local runs activate the project-wide venv first:
#   source .venv/bin/activate   (from project root)
# ansible-playbook then runs inside the venv and local tasks inherit its Python.
# For remote VMs Ansible discovers the system Python automatically.
interpreter_python = auto_silent

[privilege_escalation]
become = False

[inventory]
enable_plugins = yaml, ini

[callback_default]
result_format = yaml
