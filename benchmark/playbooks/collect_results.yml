---
# Run locally:  ansible-playbook playbooks/collect_results.yml
# Run on a VM:  ansible-playbook playbooks/collect_results.yml -e target_hosts=benchmark_vm
# Override Prometheus endpoint: -e "benchmark_prometheus_url=http://prometheus:9090"
- name: Collect Benchmark Results and Logs
  hosts: "{{ target_hosts | default('local') }}"
  gather_facts: true
  tasks:
    - name: Collect results
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: collect_results.yml
      vars:
        benchmark_collected_dir: "{{ benchmark_results_root }}/collected_{{ ansible_date_time.epoch }}"
