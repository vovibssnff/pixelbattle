---
# Phase 2 distributed (candidate) suite — same wall-clock budget as run_monolith_suite.yml,
# wired to the Swarm topology built by deploy/playbooks/{kvm-provision,swarm-init,chrony,
# swarm-redis-cluster}.yml. Results land in results/candidate/<run-id>/ so the comparison
# report (benchmark/reporting/generate-report.py) can join them with results/baseline/.
#
# Wall-clock budget (~35 min, +5 min over baseline to cover gRPC + cluster scenarios):
#   1 min  pre-flight (chrony, swarm topology, redis cluster_state, gateway /metrics)
#   1 min  swarm bring-up verification (assumes stack is already deployed)
#   6 min  Go DB bench on a backend VM: history=1, sustained 4x20s, RUW 30s,
#          concurrent_same_coord 60s, oplog_lag 60s
#   4 min  k6 nominal  (test-medium.js)
#   7 min  k6 stress   (test-heavy.js)
#  10 min  k6 breakpoint (test-breakpoint.js)
#   2 min  Playwright (place-and-watch + long-session shortened to 3 min)
#   1 min  collection + report
#  ----
#  ~32 min total wall-clock, +3 min margin
#
# Invocation:
#   ansible-playbook -i benchmark/inventory.yml benchmark/playbooks/run_distributed_suite.yml \
#       -e benchmark_phase=candidate -e benchmark_redis_cluster=true

- name: "Phase 2 candidate: derive shared run id"
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: "Set candidate run id"
      ansible.builtin.set_fact:
        benchmark_run_id: "{{ benchmark_run_id | default(ansible_date_time.epoch) }}"
        benchmark_phase: candidate

    - name: "Announce candidate run id"
      ansible.builtin.debug:
        msg: "Phase 2 candidate suite run id: {{ benchmark_run_id }} (phase=candidate)"

# ---------------------------------------------------------------------------
# 1. Pre-flight on every Swarm VM (chrony, docker info, optional swarm node ls).
# ---------------------------------------------------------------------------

- name: "Phase 2: cluster pre-flight (chrony + docker info on every VM)"
  hosts: swarm_all
  become: true
  gather_facts: true
  vars:
    benchmark_run_id: "{{ hostvars['localhost'].benchmark_run_id }}"
    benchmark_phase: candidate
  tasks:
    - name: "chrony: verify clock is synchronised"
      ansible.builtin.command: chronyc tracking
      register: chrony_check
      changed_when: false
      failed_when: chrony_check.rc != 0

    - name: "docker: verify daemon up and joined to swarm"
      ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
      register: docker_swarm_state
      changed_when: false

    - name: "Assert swarm state == active"
      ansible.builtin.assert:
        that:
          - "'active' in (docker_swarm_state.stdout | default(''))"
        fail_msg: "{{ inventory_hostname }} is not part of the swarm"

# ---------------------------------------------------------------------------
# 2. Cluster bring-up verification (manager).
# ---------------------------------------------------------------------------

- name: "Phase 2: verify Redis Cluster is formed and stack services are running"
  hosts: swarm_manager
  become: true
  gather_facts: false
  vars:
    benchmark_run_id: "{{ hostvars['localhost'].benchmark_run_id }}"
    benchmark_phase: candidate
  tasks:
    - name: "redis: cluster_state ok"
      ansible.builtin.shell: >-
        docker run --rm --network host redis:7.4.2
        redis-cli -h {{ groups['swarm_redis_workers'] | map('extract', hostvars, 'ansible_host') | list | first }} -p 6379
        cluster info | grep cluster_state
      register: cluster_state_out
      changed_when: false
      failed_when: "'cluster_state:ok' not in cluster_state_out.stdout"

    - name: "gateway: gw-1 /metrics reachable"
      ansible.builtin.uri:
        url: "http://{{ hostvars['vm-backend-1'].ansible_host }}:8081/metrics"
        status_code: 200
      register: gw1_metrics
      retries: 6
      delay: 5
      until: gw1_metrics.status == 200

    - name: "gateway: gw-2 /metrics reachable"
      ansible.builtin.uri:
        url: "http://{{ hostvars['vm-backend-2'].ansible_host }}:8081/metrics"
        status_code: 200
      register: gw2_metrics
      retries: 6
      delay: 5
      until: gw2_metrics.status == 200

# ---------------------------------------------------------------------------
# 3. Go DB bench on vm-backend-1 (sidecar pattern; uses the same cluster the gateways use).
# ---------------------------------------------------------------------------

- name: "Phase 2: Go DB bench on vm-backend-1 (cluster, +concurrent_same_coord +oplog_lag)"
  hosts: vm-backend-1
  become: true
  gather_facts: true
  vars:
    benchmark_run_id: "{{ hostvars['localhost'].benchmark_run_id }}"
    benchmark_phase: candidate
    benchmark_history_rounds: 1
    benchmark_sustained_duration_sec: 20
    benchmark_ruw_duration_sec: 30
    benchmark_concurrent_same_coord_sec: 60
    benchmark_oplog_lag_sec: 60
    benchmark_enable_db_bench: true
    benchmark_run_db_on_vm: true
    benchmark_redis_cluster: true
    benchmark_topology_label: "kvm-swarm-3shards-2gateways"
  tasks:
    - name: "preflight: include topology check"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: preflight_topology.yml

    - name: "Setup database (Redis cluster)"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: setup_database.yml
      vars:
        benchmark_storage_type: redis

    - name: "Run Go DB bench (cluster + CRDT + oplog_lag scenarios)"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: run_db_benchmarks.yml

# ---------------------------------------------------------------------------
# 4. Loaders (laptop): k6 + Playwright against the Swarm manager (Caddy LB).
# ---------------------------------------------------------------------------

- name: "Phase 2: loader pre-flight + k6 nominal/stress/breakpoint + Playwright (23 min)"
  hosts: loaders
  gather_facts: true
  vars:
    benchmark_run_id: "{{ hostvars['localhost'].benchmark_run_id }}"
    benchmark_phase: candidate
    benchmark_target_host: "{{ hostvars['vm-manager'].ansible_host }}"
  tasks:
    - name: "preflight: include topology check"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: preflight_topology.yml

    - name: "k6 nominal (test-medium.js, 4 min)"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: run_k6_tests.yml
      vars:
        benchmark_storage_type: redis
        benchmark_test_type: medium
        benchmark_use_systemd_scope: true

    - name: "k6 stress (test-heavy.js, 7 min)"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: run_k6_tests.yml
      vars:
        benchmark_storage_type: redis
        benchmark_test_type: heavy
        benchmark_use_systemd_scope: true

    - name: "k6 breakpoint (test-breakpoint.js, 10 min, abortOnFail expected)"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: run_k6_tests.yml
      vars:
        benchmark_storage_type: redis
        benchmark_test_type: breakpoint
        benchmark_use_systemd_scope: true

    - name: "Playwright UX harness (place-and-watch + long-session, 2 min)"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: run_playwright.yml

# ---------------------------------------------------------------------------
# 5. Manager-side artefact collection (Prom snapshot, container logs, swarm topology).
# ---------------------------------------------------------------------------

- name: "Phase 2: manager-side artefact collection"
  hosts: swarm_manager
  become: true
  gather_facts: true
  vars:
    benchmark_run_id: "{{ hostvars['localhost'].benchmark_run_id }}"
    benchmark_phase: candidate
  tasks:
    - name: "Snapshot docker swarm topology"
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p {{ benchmark_results_root }}/collected_{{ benchmark_run_id }}/swarm
        docker node ls > {{ benchmark_results_root }}/collected_{{ benchmark_run_id }}/swarm/nodes.txt
        docker stack services pixelbattle > {{ benchmark_results_root }}/collected_{{ benchmark_run_id }}/swarm/services.txt
        docker stack ps pixelbattle > {{ benchmark_results_root }}/collected_{{ benchmark_run_id }}/swarm/tasks.txt
      args:
        executable: /bin/bash
      changed_when: true

    - name: "collect: assemble local artefact tree"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: collect_results.yml
      vars:
        benchmark_collected_dir: "{{ benchmark_results_root }}/collected_{{ benchmark_run_id }}"

# ---------------------------------------------------------------------------
# 6. Loaders (laptop): fetch into results/candidate/<run-id>/ and generate report.
# ---------------------------------------------------------------------------

- name: "Phase 2: fetch artefacts to results/candidate/<run-id>/ and generate report"
  hosts: loaders
  gather_facts: true
  vars:
    benchmark_run_id: "{{ hostvars['localhost'].benchmark_run_id }}"
    benchmark_phase: candidate
    benchmark_db_delegate_host: swarm_manager
  tasks:
    - name: "fetch: pull manager artefacts into results/candidate/<run-id>/"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: fetch_to_candidate.yml

    - name: "report: emit Markdown comparison report (baseline + candidate)"
      ansible.builtin.include_role:
        name: benchmark
        tasks_from: generate_report.yml
      vars:
        benchmark_results_root: "{{ benchmark_project_root }}/results/candidate/{{ benchmark_run_id }}"

    - name: "Done"
      ansible.builtin.debug:
        msg:
          - "=== Phase 2 candidate suite complete ==="
          - "Results: {{ playbook_dir | dirname | dirname }}/results/candidate/{{ benchmark_run_id }}/"
          - "Open the comparison Grafana dashboard with version=baseline|candidate to inspect KPIs."
