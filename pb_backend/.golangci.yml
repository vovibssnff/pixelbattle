version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - staticcheck
    - ineffassign
    - unconvert
    - unparam
    - misspell
    - bodyclose
    - noctx
    - gocritic
    - prealloc
  settings:
    gosec:
      excludes:
        - G104
        # Server timeouts: tracked for a follow-up in SECURITY.md
        - G114
        # Canvas dimensions are bounded by config; conversions are intentional
        - G115
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
      - ".*_grpc\\.pb\\.go$"
    rules:
      # Idiomatic deferred Close() on cursors, response bodies, websocket conns, etc.
      - linters: [errcheck]
        text: 'Error return value of .*\.Close.* is not checked'
      # Generated protobuf / gRPC (Phase 2); gosec is run on hand-written code only.
      - path: '(^|/)gen/.*\.go$|.*\.pb\.go$|.*_grpc\.pb\.go$'
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
