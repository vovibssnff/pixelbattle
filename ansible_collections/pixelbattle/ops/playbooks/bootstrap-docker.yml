---
- name: Bootstrap Docker on all Swarm nodes
  hosts: swarm_all
  become: true
  gather_facts: true
  vars:
    docker_gpg_key_url: https://download.docker.com/linux/ubuntu/gpg
    docker_gpg_key_local: /tmp/pixelbattle-docker.asc
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3
          - python3-pip
        state: present
        update_cache: true

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key on controller
      ansible.builtin.get_url:
        url: "{{ docker_gpg_key_url }}"
        dest: "{{ docker_gpg_key_local }}"
        mode: "0644"
        force: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Copy Docker GPG key to node
      ansible.builtin.copy:
        src: "{{ docker_gpg_key_local }}"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_facts.architecture | regex_replace('x86_64', 'amd64') | regex_replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts.distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: true

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker works
      ansible.builtin.command: docker info --format '{{ "{{" }}.ServerVersion{{ "}}" }}'
      changed_when: false
