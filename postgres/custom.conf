# PostgreSQL 16 tuning for PixelBattle append-heavy workload
# VM: ~25 GB RAM, 12 vCPUs, virtio/SSD-backed storage
#
# This file replaces the auto-generated postgresql.conf.
# Settings not listed here use PG defaults.

# ---- Core identity (required when replacing the default conf) ----
listen_addresses = '*'
port = 5432

# ---- Memory ----
shared_buffers = 6GB
effective_cache_size = 18GB
work_mem = 32MB
maintenance_work_mem = 512MB
wal_buffers = 64MB

# ---- WAL / Checkpoints (append-heavy) ----
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = zstd
synchronous_commit = off

# ---- WAL level (no replicas needed for benchmark) ----
wal_level = minimal
max_wal_senders = 0

# ---- Planner (SSD / virtio) ----
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200

# ---- Parallelism ----
max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# ---- Autovacuum (aggressive for append table) ----
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_max_workers = 4

# ---- Connections ----
max_connections = 200

# ---- Misc ----
jit = off
huge_pages = try

# ---- Logging (keep minimal for benchmarks) ----
log_min_duration_statement = 5000
logging_collector = on
log_directory = 'pg_log'
