services:
  redis:
    image: redis:7.4.2
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    environment:
      - REDIS_PASSWORD=redis
      - REDIS_PORT=6379
      - REDIS_DATABASES=16

  migrator:
    build:
      context: ./pb_backend
      dockerfile: Dockerfile
    command: ["go", "run", "./cmd/migrator/main.go"]
    env_file:
      - ./pb_backend/app.env
    depends_on:
      - redis
    restart: "no"

  backend:
    build: ./pb_backend
    restart: unless-stopped
    env_file:
      - ./pb_backend/app.env
    depends_on:
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--log.level=info"

  grafana:
    image: grafana/grafana-enterprise
    restart: unless-stopped
    environment:
      - GF_LOG_LEVEL=error

  nginx:
    build: ./pb_frontend
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./pb_frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./pb_frontend/nginx/cert/megapixelbattle.crt:/etc/nginx/ssl/megapixelbattle.crt:ro
      - ./pb_frontend/nginx/cert/megapixelbattle.key:/etc/nginx/ssl/megapixelbattle.key:ro
      - ./pb_frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - redis
      - grafana

volumes:
  redis-data:
