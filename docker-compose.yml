services:
  redis:
    image: redis:7.4.2
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./redis/redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=redis
      - REDIS_PORT=6379
      - REDIS_DATABASES=16

  influxdb:
    image: influxdb:latest
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=root
      - DOCKER_INFLUXDB_INIT_PASSWORD=rootroot
      - DOCKER_INFLUXDB_INIT_ORG=pixelbattle
      - DOCKER_INFLUXDB_INIT_BUCKET=canvas
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=THIS_IS_A_TOKEN
    ports:
      - "127.0.0.1:8086:8086"
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/mongod.conf:/etc/mongod.conf
      - ./mongodb/logs:/var/log/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    command: --bind_ip_all

  migrator:
    build:
      context: ./pb_backend
      dockerfile: Dockerfile
    command: ["go", "run", "./cmd/migrator/main.go"]
    env_file:
      - ./pb_backend/app.env
    depends_on:
      - redis
      - mongodb
    restart: "no"

  backend:
    build: ./pb_backend
    restart: unless-stopped
    env_file:
      - ./pb_backend/app.env
    depends_on:
      - redis
      - mongodb
      - migrator
      - influxdb

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--log.level=info"

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    environment:
      - GF_LOG_LEVEL=error
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=*
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_PLUGINS_DISABLE_ANGULAR=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb

  nginx:
    build: ./pb_frontend
    restart: unless-stopped
    ports:
      - 443:443
    volumes:
      - ./pb_frontend/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./pb_frontend/nginx/cert/megapixelbattle.crt:/etc/nginx/ssl/megapixelbattle.crt
      - ./pb_frontend/nginx/cert/megapixelbattle.key:/etc/nginx/ssl/megapixelbattle.key
      - ./pb_frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - redis
      - grafana

volumes:
  grafana-storage:
  influx-data:
  influx-config:
