networks:
  internal:
    driver: bridge

services:
  redis:
    image: redis:7.4.2
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    networks: [internal]
    volumes:
      - ./redis/redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    # Loopback-only: Go DB benchmarker on the host/VM connects to localhost:6379 (plan §7.0).
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}
      - REDIS_PORT=6379
      - REDIS_DATABASES=16
    security_opt: ["no-new-privileges:true"]
    # Phase 1 §7.0 budget: Redis = 4g of the VM 16g aggregate cap.
    deploy:
      resources:
        limits:
          memory: 4g
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    # Must match featureCompatibilityVersion in ./mongodb/data (7.x cannot open 8.x data).
    image: mongo:8.2.4
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/mongod.conf:/etc/mongod.conf
      - ./mongodb/logs:/var/log/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    command: --bind_ip_all
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 1g
    mem_limit: 1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval 'db.runCommand({ping:1})'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./pb_backend
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    networks: [internal]
    env_file:
      - ./pb_backend/app.env.docker
    depends_on:
      redis: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 8g
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:8080/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb-exporter:
    image: percona/mongodb_exporter:0.44
    restart: unless-stopped
    networks: [internal]
    command:
      - "--mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/admin?authSource=admin"
      - "--compatible-mode"
      - "--collect-all"
    depends_on:
      mongodb: { condition: service_healthy }
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 128m
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks: [internal]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "0:0"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=180d"
      - "--log.level=info"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
      - mongodb-exporter
      - blackbox-exporter
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 1g
    mem_limit: 1g

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    networks: [internal]
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 128m
    mem_limit: 128m

  mimir:
    image: grafana/mimir:2.13.1
    restart: unless-stopped
    profiles: ["longterm"]
    networks: [internal]
    command:
      - "-config.file=/etc/mimir/mimir.yaml"
    volumes:
      - ./monitoring/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - ./monitoring/mimir_data:/data
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # mimir runs only under the `longterm` profile; not counted against the 16g cap during benchmarks.
    deploy:
      resources:
        limits:
          memory: 1g
    mem_limit: 1g

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    networks: [internal]
    user: "472:472"
    environment:
      - GF_LOG_LEVEL=error
      - GF_INSTALL_PLUGINS=volkovlabs-form-panel,yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:?Set GRAFANA_ROOT_URL in .env (e.g. https://localhost/panel/)}
      - GF_SERVER_PROTOCOL=http
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512m
    mem_limit: 512m

  caddy:
    build:
      context: ./pb_frontend
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    networks: [internal]
    ports:
      - "443:443"
      - "80:80"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?...}
      ACME_EMAIL: ${ACME_EMAIL:?...}
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/tls.inc:/etc/caddy/tls.inc:ro
      - ./certs:/etc/caddy/certs:ro
      # caddy_html volume mount REMOVED — /srv is now baked in
    depends_on:
      backend: { condition: service_healthy }
      grafana: { condition: service_started }
      prometheus: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 128m
    mem_limit: 128m
