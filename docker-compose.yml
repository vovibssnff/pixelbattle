volumes:
  prometheus_tsdb:
  grafana_lib:

services:
  redis:
    image: redis:7.4.2
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./redis/redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=redis
      - REDIS_PORT=6379
      - REDIS_DATABASES=16

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pixelbattle
      - POSTGRES_PASSWORD=pixelbattle
      - POSTGRES_DB=pixelbattle
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelbattle"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/mongod.conf:/etc/mongod.conf
      - ./mongodb/logs:/var/log/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    command: --bind_ip_all

  migrator:
    build:
      context: ./pb_backend
      dockerfile: Dockerfile
    command: ["go", "run", "./cmd/migrator/main.go"]
    env_file:
      - ./pb_backend/app.env
    depends_on:
      - redis
      - mongodb
    restart: "no"

  backend:
    build: ./pb_backend
    restart: unless-stopped
    env_file:
      - ./pb_backend/app.env
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - postgres
      - mongodb
      - migrator

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_tsdb:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--log.level=info"
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      - GF_LOG_LEVEL=error
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Anonymous Viewer: no login on /panel (override GRAFANA_ROOT_URL to match public URL, e.g. https://your-host/panel/)
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - "GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://pixelbattle.space/panel/}"
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana_lib:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  nginx:
    build: ./pb_frontend
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./pb_frontend/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./pb_frontend/nginx/cert/megapixelbattle.crt:/etc/nginx/ssl/megapixelbattle.crt
      - ./pb_frontend/nginx/cert/megapixelbattle.key:/etc/nginx/ssl/megapixelbattle.key
      - ./pb_frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - redis
      - grafana
