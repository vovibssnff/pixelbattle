name: CI

on:
  push:
    branches: [new-master, master]
  pull_request:
    branches: [new-master, master]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_SEMGREP: "0"

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pb_backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: pb_backend/go.mod
          cache: true
          cache-dependency-path: pb_backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: pb_backend

  backend-sast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pb_backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: pb_backend/go.mod
          cache: true
          cache-dependency-path: pb_backend/go.sum
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -exclude=G104,G114,G115 pb_backend/...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: semgrep
        if: env.CI_SEMGREP == '1'
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/ci
            p/golang
            p/owasp-top-ten
            p/dockerfile

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pb_frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pb_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pb_frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pb_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: NPM audit (high+)
        run: NPM_CONFIG_FETCH_RETRIES=8 NPM_CONFIG_FETCH_RETRY_MINTIMEOUT=20000 npm audit --audit-level=high
      - name: semgrep
        if: env.CI_SEMGREP == '1'
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/owasp-top-ten

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: pb_backend/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: pb_frontend/Dockerfile
          config: .hadolint.yaml

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Git safe.directory for ansible-lint
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install "ansible-lint>=24,<26" "ansible-core>=2.16,<2.19"
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Build PixelBattle ops collection
        run: ansible-galaxy collection build ansible_collections/pixelbattle/ops --output-path /tmp/ansible-collections
      - name: Lint ops collection
        run: ansible-lint ansible_collections/pixelbattle/ops -c .ansible-lint
      - name: Syntax check production playbooks
        run: |
          for playbook in \
            deploy-stack.yml \
            build-images.yml \
            swarm-init.yml \
            swarm-redis-cluster.yml \
            provision-grafana.yml \
            harden-firewall.yml \
            install-backups.yml \
            validate-production.yml; do
            if [ -f "ansible_collections/pixelbattle/ops/playbooks/${playbook}" ]; then
              ansible-playbook \
                -i ansible_collections/pixelbattle/ops/tests/inventory/ci.yml \
                "ansible_collections/pixelbattle/ops/playbooks/${playbook}" \
                --syntax-check
            fi
          done
      - name: Ansible collection sanity
        run: |
          cd ansible_collections/pixelbattle/ops
          ansible-test sanity --docker default --skip-test import --skip-test ansible-doc
        continue-on-error: true

  benchmark-tooling-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Git safe.directory for ansible-lint
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install "ansible-lint>=24,<26" "ansible-core>=2.16,<2.19"
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Lint benchmark playbooks
        run: ansible-lint ansible_collections/pixelbattle/ops/playbooks/run_monolith_suite.yml ansible_collections/pixelbattle/ops/playbooks/run_distributed_suite.yml ansible_collections/pixelbattle/ops/roles/benchmark -c .ansible-lint

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pb_backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: pb_backend/go.mod
          cache: true
          cache-dependency-path: pb_backend/go.sum
      - name: Unit tests
        run: go test ./...

  buf-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pb_backend
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0
      - name: buf lint
        run: buf lint
      - name: buf format check
        run: buf format -d --exit-code
      - name: buf breaking (vs main)
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=master,subdir=pb_backend"
        continue-on-error: true

  docker-build:
    needs:
      - secrets-scan
      - ansible-lint
      - benchmark-tooling-lint
      - backend-test
      - backend-lint
      - backend-sast
      - buf-lint
      - frontend-lint
      - frontend-security
      - dockerfile-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build -t pb-backend:${{ github.sha }} pb_backend/
      - name: Build frontend image
        run: docker build -t pb-frontend:${{ github.sha }} pb_frontend/
