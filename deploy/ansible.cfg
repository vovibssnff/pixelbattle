[defaults]
inventory               = inventory.yml
roles_path              = roles
host_key_checking       = False
retry_files_enabled     = False
timeout                 = 30
pipelining              = True
stdout_callback         = ansible.builtin.default
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = /tmp/ansible_facts_pixelbattle_deploy
fact_caching_timeout    = 3600
interpreter_python      = auto_silent
# Encrypted vars live in group_vars/all/vault.yml; create deploy/.vault_pass with the
# password (gitignored) for unattended runs, or pass --ask-vault-pass on the CLI.
vault_password_file     = .vault_pass

[privilege_escalation]
become                  = True
become_method           = sudo

[inventory]
enable_plugins          = yaml, ini

[callback_default]
result_format           = yaml
