---

# Phase 1 (single-VM monolith) and Phase 2 (KVM micro-VM Swarm) inventory.
# See adr/004-kvm-swarm-multi-vm.md for the topology decision.

all:
  vars:
    swarm_advertise_addr: "192.168.122.10"
    swarm_subnet: "192.168.122.0/24"
    swarm_default_user: "{{ vault_deploy_user | default('ubuntu') }}"
    swarm_default_ssh_key: "{{ vault_ssh_key_path | default('~/.ssh/id_ed25519') }}"
    swarm_default_python: /usr/bin/python3

  children:
    # Phase 1 single-VM target (used by run_monolith_suite.yml; do not remove for backward compatibility).
    pixelbattle_servers:
      hosts:
        pixelbattle_vm:
          ansible_host: "{{ vault_server_host }}"
          ansible_user: "{{ vault_deploy_user }}"
          ansible_password: "{{ vault_deploy_password }}"
          ansible_ssh_private_key_file: "{{ vault_ssh_key_path | default('~/.ssh/id_ed25519') }}"
          ansible_become_password: "{{ vault_become_password | default(omit) }}"
          ansible_ssh_common_args: "{{ vault_ssh_common_args | default('') }}"
          ansible_python_interpreter: /usr/bin/python3

    # Phase 2 KVM Swarm topology (created by deploy/playbooks/kvm-provision.yml on the host).
    swarm_manager:
      hosts:
        vm-manager:
          ansible_host: "192.168.122.10"
          ansible_user: "{{ swarm_default_user }}"
          ansible_ssh_private_key_file: "{{ swarm_default_ssh_key }}"
          ansible_python_interpreter: "{{ swarm_default_python }}"
          swarm_role: manager
          vm_cpu: 2
          vm_mem_mb: 6144

    swarm_backend_workers:
      hosts:
        vm-backend-1:
          ansible_host: "192.168.122.11"
          swarm_role: backend
          gateway_grpc_port: 9000
          gateway_instance_id: gw-1
          vm_cpu: 3
          vm_mem_mb: 5120
        vm-backend-2:
          ansible_host: "192.168.122.12"
          swarm_role: backend
          gateway_grpc_port: 9000
          gateway_instance_id: gw-2
          vm_cpu: 3
          vm_mem_mb: 5120
      vars:
        ansible_user: "{{ swarm_default_user }}"
        ansible_ssh_private_key_file: "{{ swarm_default_ssh_key }}"
        ansible_python_interpreter: "{{ swarm_default_python }}"

    swarm_redis_workers:
      hosts:
        vm-redis-1:
          ansible_host: "192.168.122.13"
          swarm_role: redis
          redis_shard_id: c1
          vm_cpu: 1
          vm_mem_mb: 2048
        vm-redis-2:
          ansible_host: "192.168.122.14"
          swarm_role: redis
          redis_shard_id: c2
          vm_cpu: 1
          vm_mem_mb: 2048
        vm-redis-3:
          ansible_host: "192.168.122.15"
          swarm_role: redis
          redis_shard_id: c3
          vm_cpu: 1
          vm_mem_mb: 2048
      vars:
        ansible_user: "{{ swarm_default_user }}"
        ansible_ssh_private_key_file: "{{ swarm_default_ssh_key }}"
        ansible_python_interpreter: "{{ swarm_default_python }}"

    swarm_workers:
      children:
        swarm_backend_workers:
        swarm_redis_workers:

    swarm_all:
      children:
        swarm_manager:
        swarm_workers:

    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_become: false
