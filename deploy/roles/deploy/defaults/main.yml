---
# Git
deploy_git_repo: "https://github.com/your-org/pixelbattle.git"
deploy_git_branch: "main"
deploy_project_dir: "/opt/pixelbattle"

# SSL certificates
deploy_cert_dir: "{{ deploy_project_dir }}/pb_frontend/nginx/cert"
deploy_cert_name: "megapixelbattle"
deploy_cert_country: "RU"
deploy_cert_state: "SPB"
deploy_cert_city: "Saint-Petersburg"
deploy_cert_org: "ITMO"
deploy_cert_cn: "megapixelbattle.ru"
deploy_cert_days: 365
deploy_cert_force_regenerate: false

# docker compose up can fail on transient Docker Hub TLS/network errors; retry before failing.
deploy_compose_retries: 5
deploy_compose_retry_delay: 45

# Backend configuration (app.env) — keys must match pb_backend/internal/utils/config.go
deploy_backend_env:
  STORAGE_TYPE: "redis"
  REDIS_ADDR: "redis:6379"
  REDIS_PSW: "redis"
  REDIS_HISTORY: "0"
  REDIS_TIMER: "1"
  REDIS_USERS: "2"
  REDIS_BANNED: "3"
  MONGO_URI: "mongodb://root:root@mongodb:27017"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "pixelbattle"
  POSTGRES_PASSWORD: "pixelbattle"
  POSTGRES_DB: "pixelbattle"
  CANVAS_HEIGHT: "250"
  CANVAS_WIDTH: "500"
  API_VERSION: "5.131"
  SERVICE_TOKEN: ""
  WS_ALLOW_ANONYMOUS: "true"

# Runtime directories that docker compose volumes expect
deploy_data_dirs:
  - "{{ deploy_project_dir }}/redis/redis_data"
  - "{{ deploy_project_dir }}/postgres/data"
  - "{{ deploy_project_dir }}/mongodb/data"
  - "{{ deploy_project_dir }}/mongodb/logs"
  - "{{ deploy_project_dir }}/monitoring/grafana/provisioning"
  - "{{ deploy_project_dir }}/monitoring/grafana/dashboards"
