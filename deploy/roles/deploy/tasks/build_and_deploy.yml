---
- name: Build and deploy application stack
  ansible.builtin.command:
    cmd: docker compose up -d --build --force-recreate --pull always
    chdir: "{{ deploy_project_dir }}"
  register: deploy_compose_result
  changed_when: >-
    'Started' in deploy_compose_result.stderr
    or 'Creating' in deploy_compose_result.stderr
    or 'Recreated' in deploy_compose_result.stderr

- name: Wait for backend to become healthy
  ansible.builtin.uri:
    url: "http://localhost:8080/metrics"
    method: GET
    status_code: 200
  register: deploy_health_check
  until: deploy_health_check.status == 200
  retries: 30
  delay: 5
