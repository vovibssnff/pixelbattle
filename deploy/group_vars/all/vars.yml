---
# Non-secret deployment defaults. Anything sensitive lives in vault.yml (encrypted).
#
# Override at the inventory or CLI level (`-e key=value`) without editing this file.

# --- Ansible connection defaults ---
ansible_become_password: "{{ vault_become_password }}"

# --- Source ---
deploy_git_repo: "{{ vault_repo_url }}"
deploy_git_branch: "phase-1-metrics-baseline"
deploy_project_dir: "/opt/pixelbattle"

# --- docker compose retries (Docker Hub TLS hiccups, slow VMs) ---
deploy_compose_retries: 5
deploy_compose_retry_delay: 45

# --- Caddy TLS strategy ---
# internal     : Caddy issues an internal CA cert; works with no DNS (default).
# acme         : Caddy gets a public cert from Let's Encrypt (needs DNS + ports 80/443 open).
# selfsigned   : This playbook generates a self-signed PEM pair into ./certs/.
caddy_tls_mode: "acme"

# Public hostname for Caddy / ACME / self-signed CN.
# For `internal` mode any hostname works (Caddy issues a cert for it).
# For `acme` this MUST be a public DNS name pointing to the host.
caddy_domain: "{{ vault_caddy_domain | default('pixelbattle.local') }}"
pixelbattle_domain: "{{ caddy_domain }}"

# Minimum lengths for deploy-stack asserts. Use 16+ in production.
grafana_admin_password_min_length: 16
redis_password_min_length: 16
mongo_password_min_length: 16

# Required if caddy_tls_mode == "acme"; ignored otherwise.
acme_email: "{{ vault_acme_email | default('') }}"

# --- Self-signed cert (only used when caddy_tls_mode == "selfsigned") ---
selfsigned_cert_dir: "{{ deploy_project_dir }}/certs"
selfsigned_cert_name: "pixelbattle"
selfsigned_cert_country: "RU"
selfsigned_cert_state: "SPB"
selfsigned_cert_city: "Saint-Petersburg"
selfsigned_cert_org: "ITMO"
selfsigned_cert_days: 365
selfsigned_cert_force_regenerate: false

# --- Backend tunables (non-secret) ---
# Match Phase 1 benchmark harness (k6 + Go bench) canvas size.
deploy_canvas_height: 250
deploy_canvas_width: 500
deploy_pixel_cooldown_sec: 3
deploy_log_level: "info"
deploy_session_secure: true
# Load tests may override this to true; production requires authenticated WebSockets.
deploy_ws_allow_anonymous: false
deploy_rate_limit_ws_conn_per_min: 50
deploy_api_version: "5.131"
deploy_admin_ids: ""
deploy_admin_usernames: ""
deploy_redis_history_db: 0
deploy_redis_timer_db: 1

# --- Production firewall defaults ---
# Override these with your office/VPN IP ranges before running the firewall role.
admin_allowed_cidrs: "{{ vault_admin_allowed_cidrs | default(['127.0.0.1/32']) }}"

swarm_node_allowed_ips: "{{ groups['swarm_all'] | map('extract', hostvars, 'ansible_host') | list }}"

# --- Runtime data dirs created on the host (compose bind-mounts) ---
deploy_data_dirs:
  - {path: "{{ deploy_project_dir }}/redis/redis_data", owner: "root", group: "root"}
  - {path: "{{ deploy_project_dir }}/mongodb/data", owner: "999", group: "999"}  # mongo UID
  - {path: "{{ deploy_project_dir }}/mongodb/logs", owner: "999", group: "999"}
  - {path: "{{ deploy_project_dir }}/monitoring/prometheus_data", owner: "65534", group: "65534"}  # prom UID/GID
  - {path: "{{ deploy_project_dir }}/monitoring/grafana_data", owner: "472", group: "472"}  # grafana UID
  - {path: "{{ deploy_project_dir }}/certs", owner: "root", group: "root"}
